package:
  name: elmish
  publish:
    version: 0.15.0
    license: MIT
    location:
      githubOwner: collegevine
      githubRepo: purescript-elmish
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - argonaut-core: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - bifunctors: ">=6.1.0 <7.0.0"
    - debug: ">=6.0.2 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign: ">=7.0.0 <8.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - js-date: ">=8.0.0 <9.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - undefined-is-not-a-problem: ">=1.1.0 <2.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - avar
      - spec
      - spec-node
      - elmish-testing-library
      - elmish-html
workspace:
  extraPackages:
    # TODO: move these to the v0.13.0 / v0.4.0 tags once those releases are cut.
    elmish-html:
      git: https://github.com/collegevine/purescript-elmish-html.git
      ref: split-react
    elmish-testing-library:
      git: https://github.com/collegevine/purescript-elmish-testing-library.git
      ref: split-react
  packageSet:
    registry: 72.0.0
